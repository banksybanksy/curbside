<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Curbside · SF food trucks</title>
  <meta name="description" content="Map of San Francisco's permitted food trucks and carts, filterable by food, permit status and day.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffe9d2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1811">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌮</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
        integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="sidebar-head">
        <h1><span class="logo-emoji" aria-hidden="true">🌮</span> Curbside</h1>
        <p class="tagline">San Francisco's permitted food trucks and carts</p>
        <div class="data-meta">
          <span id="data-freshness" role="status">Loading…</span>
          <button id="refresh-btn" type="button" title="Re-pull data from DataSF"><span class="refresh-icon" aria-hidden="true">↻</span> <span class="refresh-label">Refresh data</span></button>
        </div>
      </header>

      <div class="filters">
        <input type="search" id="search" aria-label="Search by street, place or vendor" placeholder="🔍 Search a street, spot, or vendor…" autocomplete="off" enterkeyhint="search">
        <button id="filters-toggle" type="button" class="filters-toggle" aria-expanded="false" aria-controls="filter-panel">
          <span>Filters</span><span id="filter-count" class="filter-count" hidden></span><span class="caret" aria-hidden="true">▾</span>
        </button>
        <div id="filter-panel" class="filter-panel">
          <input type="search" id="food-search" aria-label="Filter by food" placeholder="Food: tacos, coffee, dessert…" autocomplete="off" enterkeyhint="search">
          <div class="chips" id="chips" role="group" aria-label="Quick food filters">
            <button type="button" class="chip" data-food="taco" aria-pressed="false"><span aria-hidden="true">🌮</span> Tacos</button>
            <button type="button" class="chip" data-food="burger" aria-pressed="false"><span aria-hidden="true">🍔</span> Burgers</button>
            <button type="button" class="chip" data-food="coffee" aria-pressed="false"><span aria-hidden="true">☕</span> Coffee</button>
            <button type="button" class="chip" data-food="dessert" aria-pressed="false"><span aria-hidden="true">🍦</span> Dessert</button>
            <button type="button" class="chip" data-food="asian" aria-pressed="false"><span aria-hidden="true">🍜</span> Asian</button>
            <button type="button" class="chip" data-food="sandwich" aria-pressed="false"><span aria-hidden="true">🥪</span> Sandwiches</button>
          </div>
          <div class="selects">
            <select id="status-filter" aria-label="Permit status">
              <option value="APPROVED" selected>Approved</option>
              <option value="">Any status</option>
              <option value="REQUESTED">Requested</option>
              <option value="EXPIRED">Expired</option>
              <option value="SUSPEND">Suspended</option>
              <option value="ISSUED">Issued</option>
            </select>
            <select id="day-filter" aria-label="Day of operation">
              <option value="">Any day</option>
              <option value="now">Open now (SF time)</option>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
          </div>
        </div>
        <div class="result-bar">
          <span id="result-count" aria-live="polite"></span>
          <button id="clear-filters" type="button" class="linkish" hidden>Clear filters</button>
        </div>
      </div>

      <ul class="results" id="results" aria-label="Vendors"></ul>
    </aside>

    <main class="main">
      <div class="view-toggle" role="group" aria-label="View">
        <button id="view-map" type="button" class="active" aria-pressed="true"><span aria-hidden="true">🗺️</span> Map</button>
        <button id="view-table" type="button" aria-pressed="false"><span aria-hidden="true">📋</span> Table</button>
      </div>
      <div id="map"></div>
      <div id="table-view" class="table-wrap" hidden>
        <table>
          <thead>
            <tr><th>Vendor</th><th>Food</th><th>Address</th><th>Status</th><th>Days</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
          integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
  <script src="schedule.js"></script>
  <script src="app.js"></script>
</body>
</html>
