<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SF Food Truck Finder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌮</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="sidebar-head">
        <h1><span class="logo-emoji">🌮</span> SF Food Trucks</h1>
        <p class="tagline">find what's rollin' near you</p>
        <div class="data-meta">
          <span id="data-freshness">Loading…</span>
          <button id="refresh-btn" title="Re-pull data from DataSF"><span class="refresh-icon">↻</span> <span class="refresh-label">Refresh data</span></button>
        </div>
      </header>

      <div class="filters">
        <input type="search" id="search" placeholder="🔍 Search a street, spot, or vendor…" autocomplete="off">
        <input type="search" id="food-search" placeholder="Craving something? tacos, coffee, dessert…" autocomplete="off">
        <div class="chips" id="chips">
          <button class="chip" data-food="taco">🌮 Tacos</button>
          <button class="chip" data-food="burger">🍔 Burgers</button>
          <button class="chip" data-food="coffee">☕ Coffee</button>
          <button class="chip" data-food="dessert">🍦 Dessert</button>
          <button class="chip" data-food="asian">🍜 Asian</button>
          <button class="chip" data-food="sandwich">🥪 Sandwiches</button>
        </div>
        <div class="selects">
          <select id="status-filter" title="Permit status">
            <option value="APPROVED" selected>Approved</option>
            <option value="">Any status</option>
            <option value="REQUESTED">Requested</option>
            <option value="EXPIRED">Expired</option>
            <option value="SUSPEND">Suspended</option>
            <option value="ISSUED">Issued</option>
          </select>
          <select id="day-filter" title="Day of operation">
            <option value="">Any day</option>
            <option value="now">Open now</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
        </div>
        <div class="result-bar">
          <span id="result-count"></span>
          <button id="clear-filters" class="linkish">Clear filters</button>
        </div>
      </div>

      <ul class="results" id="results"></ul>
    </aside>

    <main class="main">
      <div class="view-toggle">
        <button id="view-map" class="active">🗺️ Map</button>
        <button id="view-table">📋 Table</button>
      </div>
      <div id="map"></div>
      <div id="table-view" class="table-wrap" hidden>
        <table>
          <thead>
            <tr><th>Vendor</th><th>Food</th><th>Address</th><th>Status</th><th>Days</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
